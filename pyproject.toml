[project]
name = "assistant"
version = "0.1.0"
description = "A terminal personal assistant for Google Workspace, running on Ollama or Claude through MCP"
readme = "README.md"
authors = [
    { name = "Stephen", email = "stearsail@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    # openai: agno's Ollama model is built on its OpenAI one
    "agno[anthropic,mcp,ollama,openai,sqlite]>=3.0.6",
    "ollama>=0.6.2",
    "prompt-toolkit>=3.0.53",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[project.scripts]
assistant = "assistant.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
